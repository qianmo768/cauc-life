<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>云同步 · 校园生活小管家</title>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #0f1420; color: #e8edf7; display: grid; place-items: center; min-height: 100dvh; }
    .box { max-width: 320px; padding: 24px; text-align: center; }
    h1 { font-size: 18px; margin: 0 0 8px; }
    p { font-size: 13px; line-height: 1.7; color: #9aa7bd; margin: 8px 0; }
    button { margin-top: 16px; width: 100%; padding: 12px; border: 0; border-radius: 10px; background: #2f6bff; color: #fff; font-size: 15px; font-weight: 600; }
    .tip { font-size: 12px; color: #7f8ca3; }
  </style>
</head>
<body>
  <div class="box">
    <h1>云同步</h1>
    <p id="msg">正在恢复同步密钥…</p>
    <button id="go" hidden>进入应用</button>
    <p class="tip" id="tip" hidden>先把本页添加到主屏幕（浏览器菜单 →「添加到主屏幕」），以后点桌面图标即可。</p>
  </div>
  <script>
    (function () {
      var CONFIG_KEY = 'cauc-life-sync-v1';

      function decode(value) {
        var raw = String(value).replace(/-/g, '+').replace(/_/g, '/');
        while (raw.length % 4) raw += '=';
        try { return JSON.parse(atob(raw)); } catch (e) { return null; }
      }

      var match = /(?:^#|[&#])sync=([^&]+)/.exec(location.hash || '');
      if (!match) { location.replace('./'); return; }

      var config = decode(decodeURIComponent(match[1]));
      var hadConfig = false;
      try { hadConfig = Boolean(localStorage.getItem(CONFIG_KEY)); } catch (e) {}

      if (config && config.t && config.g) {
        try {
          localStorage.setItem(CONFIG_KEY, JSON.stringify({ token: config.t, gistId: config.g, lastSyncAt: null }));
          document.getElementById('msg').textContent = '同步密钥已恢复';
        } catch (e) {
          document.getElementById('msg').textContent = '这个浏览器不允许保存本地数据';
        }
      } else {
        document.getElementById('msg').textContent = '同步链接无效';
      }

      if (hadConfig) {
        location.replace('./');
        return;
      }

      var go = document.getElementById('go');
      var tip = document.getElementById('tip');
      go.hidden = false;
      tip.hidden = false;
      go.addEventListener('click', function () { location.replace('./'); });
    })();
  </script>
</body>
</html>
